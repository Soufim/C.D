# Development database only:  docker compose -f deploy/compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cdms, POSTGRES_PASSWORD: cdms, POSTGRES_DB: cdms }
    ports: ['127.0.0.1:5432:5432']
    volumes: [cdms-dev-db:/var/lib/postgresql/data]
volumes:
  cdms-dev-db:
