# Serves the SPA and proxies the API on the same origin (no CORS, SameSite=Strict cookies work).
# TLS is terminated by the Ministry's front proxy/load balancer, or add a 443 server block here.
upstream cdms_api { server api:3000; keepalive 16; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 21m;

  # Security headers (OWASP Secure Headers). CSP allows only same-origin assets.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Enable once served exclusively over HTTPS:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz { access_log off; return 200 "ok"; }

  location /api/ {
    proxy_pass http://cdms_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
  }

  # Hashed assets are immutable.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

  # SPA fallback; index.html is never cached so new releases load immediately.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }
}
